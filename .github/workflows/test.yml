name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m tests.mcp_public_smoke
      - run: python -m tests.mcp_creation_smoke
      - run: python -m tests.mcp_reference_smoke
      - run: python -m tests.mcp_quality_smoke
      - run: python -m tests.mcp_feedback_smoke
      - run: python -m tests.mcp_storage_smoke
      - run: python -m tests.mcp_projects_smoke
      - run: python -m tests.mcp_character_smoke
      - run: python -m tests.gui_character_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_editing_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_updates_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_welcome_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_feedback_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_capture_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_storage_smoke
        if: runner.os == 'Windows'
      - run: python -m tests.gui_projects_smoke
        if: runner.os == 'Windows'
      - run: python tools/build_release.py --check
